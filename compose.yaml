services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tracks
      POSTGRES_USER: tracks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracks -d tracks"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Journal: Host=db;Database=tracks;Username=tracks;Password=${POSTGRES_PASSWORD}
      Database__AutoMigrate: 'true'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - identity-keys:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres-data:
  identity-keys:
  caddy-data:
  caddy-config:
